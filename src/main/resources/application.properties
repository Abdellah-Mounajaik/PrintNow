spring.application.name=printnow
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=jdbc:mysql://localhost:3306/printnow?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=printnow_user
spring.datasource.password=printnow_password
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
# Regroupe le chargement des collections LAZY en requetes « IN (...) » au lieu
# d'une requete par ligne. Sans cela, afficher le catalogue lancait ~200 requetes
# (une par imprimerie pour ses horaires et produits, puis une par produit pour
# chacune de ses deux grilles de prix) : le catalogue mettait une dizaine de
# secondes a apparaitre. Ce reglage les regroupe et divise le temps par plusieurs.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
stripe.api.key=${STRIPE_SECRET_KEY}

# Signature des jetons de connexion.
#
# Ce secret vaut tous les mots de passe du site reunis : qui le connait peut
# fabriquer un jeton valide pour n'importe quel compte, admin compris, sans
# jamais s'authentifier. Il n'a donc rien a faire dans le depot — d'ou la
# variable d'environnement, comme pour les autres cles ci-dessus.
printnow.jwt.secret=${JWT_SECRET}
# Duree de validite d'une connexion (24 h).
printnow.jwt.expiration-ms=86400000

# Upload fichiers PDF
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads
# Documents conserves pour l'obligation legale (factures des comptes supprimes).
# Volontairement hors de app.upload.dir, qui est expose en HTTP.
app.archive.dir=archives

# Delai de conservation des PDF clients apres cloture de la commande (RGPD, art.
# 5.1.e). Passe ce delai, le fichier est efface du disque et de la base ; seule
# la facture comptable subsiste (voir PurgeFichiersClientsService). Une courte
# fenetre couvre une eventuelle reimpression ou reclamation.
purge.fichiers-clients.retention-jours=7

# Delai de conservation des documents de correction orthographique (original +
# corrige + resultat de l'analyse) apres leur derniere activite. Aucune impression
# ni facture n'en depend (voir PurgeCorrectionsService).
purge.corrections.retention-jours=7

# Delai de conservation des designs generes par l'IA (studio) : PDF + apercus +
# brief/contenu (donnees personnelles). La commande garde sa propre copie du PDF
# choisi, donc rien d'imprimable n'en depend (voir PurgeGenerationsService).
purge.generations.retention-jours=7

# Inclure le message d'erreur dans les réponses HTTP
server.error.include-message=always

# AfterShipping
aftershipping.api.key=${AFTERSHIPPING_API_KEY}
aftershipping.base.url=https://api.aftership.com/v4
aftershipping.courier.slug=bpost

# Mistral
mistral.api.key=${MISTRAL_API_KEY}
mistral.base.url=https://api.mistral.ai/v1
mistral.model=mistral-small-latest
# Correction orthographique : un modèle plus large est nettement plus fiable sur
# les accords, et ses réponses sont stables d'une exécution à l'autre.
mistral.model.correction=mistral-large-latest

# Lecture des cartes étudiante/identité (vérification étudiant) : modèle avec
# vision, le plus fiable disponible vu que son verdict peut décider seul
# (auto-acceptation/auto-refus). Pixtral (l'ancien modèle vision de Mistral)
# a été retiré : Mistral Large 3 le remplace, vision incluse. La doc Mistral
# recommande l'identifiant daté plutôt que l'alias "-latest" en production.
mistral.model.vision=mistral-large-2512

# Générateur de supports IA (module studio). Le modèle rédige le contenu ; le
# rendu PDF reste local. Les fichiers générés sont stockes hors de app.upload.dir
# (jamais exposes en HTTP), servis uniquement via endpoint authentifie.
studio.model=mistral-large-latest
studio.stockage.dir=studio

# LanguageTool (correcteur orthographique auto-hébergé — voir docker-compose.yml)
# Garde-fous de la vérification orthographique : l'analyse est gratuite mais
# consomme le quota du modèle de langue, dont dépend la qualité des corrections.
correction.pages.max=100
correction.analyses.par.heure=20

languagetool.base.url=http://localhost:8010
languagetool.base.url.sans.modele=http://localhost:8011
# Seul le français dispose des n-grammes installés ; les autres langues passent
# par l'instance sans modèle de langue.
languagetool.langues.avec.modele=fr

# Mailtrap (envoi d'emails transactionnels — sandbox de test pour le moment)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true