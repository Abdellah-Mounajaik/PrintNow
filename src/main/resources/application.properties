spring.application.name=printnow
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=jdbc:mysql://localhost:3306/printnow?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=printnow_user
spring.datasource.password=printnow_password
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
stripe.api.key=${STRIPE_SECRET_KEY}

# Upload fichiers PDF
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads
# Documents conserves pour l'obligation legale (factures des comptes supprimes).
# Volontairement hors de app.upload.dir, qui est expose en HTTP.
app.archive.dir=archives

# Inclure le message d'erreur dans les réponses HTTP
server.error.include-message=always

# AfterShipping
aftershipping.api.key=${AFTERSHIPPING_API_KEY}
aftershipping.base.url=https://api.aftership.com/v4
aftershipping.courier.slug=bpost

# Mistral
mistral.api.key=${MISTRAL_API_KEY}
mistral.base.url=https://api.mistral.ai/v1
mistral.model=mistral-small-latest
# Correction orthographique : un modèle plus large est nettement plus fiable sur
# les accords, et ses réponses sont stables d'une exécution à l'autre.
mistral.model.correction=mistral-large-latest

# LanguageTool (correcteur orthographique auto-hébergé — voir docker-compose.yml)
# Garde-fous de la vérification orthographique : l'analyse est gratuite mais
# consomme le quota du modèle de langue, dont dépend la qualité des corrections.
correction.pages.max=100
correction.analyses.par.heure=20

languagetool.base.url=http://localhost:8010
languagetool.base.url.sans.modele=http://localhost:8011
# Seul le français dispose des n-grammes installés ; les autres langues passent
# par l'instance sans modèle de langue.
languagetool.langues.avec.modele=fr

# Mailtrap (envoi d'emails transactionnels — sandbox de test pour le moment)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true