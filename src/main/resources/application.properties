spring.application.name=printnow
spring.jackson.serialization.write-dates-as-timestamps=false
spring.datasource.url=jdbc:mysql://localhost:3306/printnow?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=printnow_user
spring.datasource.password=printnow_password
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
stripe.api.key=${STRIPE_SECRET_KEY}

# Upload fichiers PDF
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
app.upload.dir=uploads

# Inclure le message d'erreur dans les réponses HTTP
server.error.include-message=always

# AfterShipping
aftershipping.api.key=${AFTERSHIPPING_API_KEY}
aftershipping.base.url=https://api.aftership.com/v4
aftershipping.courier.slug=bpost

# Mistral
mistral.api.key=${MISTRAL_API_KEY}
mistral.base.url=https://api.mistral.ai/v1
mistral.model=mistral-small-latest