version: '3.8'

services:
  # --- La Base de Données pour PrintNow ---
  mysql-db:
    image: mysql:8.0
    container_name: printnow_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: printnow
      MYSQL_USER: printnow_user
      MYSQL_PASSWORD: printnow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # --- Correcteur orthographique (vérification des PDF avant impression) ---
  # Auto-hébergé : les documents des clients ne sortent jamais de l'infrastructure.
  #
  # Deux instances, pour une raison mesurée : « languageModel » pointant vers un
  # dossier dépourvu de sous-dossier pour la langue demandée désactive
  # silencieusement toutes ses règles. Avec nos seules données françaises,
  # l'anglais renvoyait zéro faute sur une phrase qui en comptait cinq, sans la
  # moindre erreur dans les journaux. Plutôt que de télécharger des gigaoctets de
  # n-grammes anglais, la seconde instance s'en passe.
  languagetool:
    image: erikvl87/languagetool:latest
    container_name: printnow_languagetool
    environment:
      Java_Xms: 1g
      Java_Xmx: 3g
      # Données n-grammes : statistiques d'usage qui permettent de repérer les
      # mots corrects mais employés à tort (« une immense foret » au lieu de
      # « forêt »). Sans elles, ces fautes passent inaperçues.
      langtool_languageModel: /ngrams
    volumes:
      # Stockées hors du dossier du projet : plusieurs gigaoctets qu'il ne faut
      # ni versionner, ni laisser synchroniser par OneDrive.
      - C:/languagetool-ngrams/data:/ngrams:ro
      # LanguageTool ne livre que 28 paires de confusion pour le français ; on
      # substitue notre liste enrichie au fichier d'origine.
      - ./languagetool/confusion_sets_fr.txt:/LanguageTool/org/languagetool/resource/fr/confusion_sets.txt:ro
    ports:
      - "8010:8010"

  # Instance sans modèle de langue, pour les langues dont nous n'avons pas les
  # n-grammes. Elle perd les règles de confusion — qui en dépendent — mais
  # conserve l'orthographe et la grammaire, l'essentiel du service.
  languagetool-sans-modele:
    image: erikvl87/languagetool:latest
    container_name: printnow_languagetool_sans_modele
    environment:
      Java_Xms: 512m
      Java_Xmx: 2g
    ports:
      - "8011:8010"

  # --- L'interface pour voir les tables ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: printnow_phpmyadmin
    environment:
      PMA_HOST: mysql-db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8081:80"
    depends_on:
      - mysql-db

volumes:
  mysql_data: